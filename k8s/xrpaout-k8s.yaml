apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xrpaout-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: xrpaout-config
data:
  LM_STUDIO_BASE_URL: "http://192.168.0.37:8000/v1"
  LM_STUDIO_MODEL: "qwen2.5-coder-32b-vllm"
  LM_STUDIO_API_KEY: "vllm-local-key"
  LLM_VETO_ENABLED: "True"
  SELECTED_EXCHANGE: "UPBIT"
  TRADING_INTERVAL_MINUTES: "60"
  MAX_INVESTMENT_KRW: "100000"
  MOCK_MODE: "False"
  DATABASE_PATH: "/app/data/trading_log.db"
  STATE_PATH: "/app/data/trading_state.json"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrpaout-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xrpaout
  template:
    metadata:
      labels:
        app: xrpaout
    spec:
      containers:
      - name: backend
        image: xrpaout-backend:v3
        imagePullPolicy: Never
        ports:
        - containerPort: 13151
        envFrom:
        - configMapRef:
            name: xrpaout-config
        - secretRef:
            name: xrpaout-secret
        volumeMounts:
        - name: db-volume
          mountPath: /app/data
      - name: frontend
        image: xrpaout-frontend:v3
        imagePullPolicy: Never
        ports:
        - containerPort: 80
      volumes:
      - name: db-volume
        persistentVolumeClaim:
          claimName: xrpaout-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: xrpaout-service
spec:
  type: NodePort
  selector:
    app: xrpaout
  ports:
    - name: api
      port: 13151
      targetPort: 13151
      nodePort: 13151
    - name: web
      port: 13152
      targetPort: 80
      nodePort: 13152
