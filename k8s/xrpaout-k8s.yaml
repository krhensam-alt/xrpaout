apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xrpaout-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: xrpaout-config
data:
  LM_STUDIO_BASE_URL: "http://192.168.0.37:11434/v1"
  LM_STUDIO_MODEL: "qwen3.8:27b"
  SELECTED_EXCHANGE: "UPBIT"
  TRADING_INTERVAL_MINUTES: "15"
  MAX_INVESTMENT_KRW: "100000"
  MOCK_MODE: "False"
  DATABASE_PATH: "/app/data/trading_log.db"
  STATE_PATH: "/app/data/trading_state.json"
---
apiVersion: v1
kind: Secret
metadata:
  name: xrpaout-secret
type: Opaque
data:
  UPBIT_ACCESS_KEY: "CHANGE_ME_BASE64" # [!] 보안 경고: 새 키를 발급받아 다시 넣으세요.
  UPBIT_SECRET_KEY: "CHANGE_ME_BASE64"
  TELEGRAM_BOT_TOKEN: "CHANGE_ME_BASE64"
  TELEGRAM_CHAT_ID: "CHANGE_ME_BASE64"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrpaout-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xrpaout
  template:
    metadata:
      labels:
        app: xrpaout
    spec:
      containers:
      - name: backend
        image: xrpaout-backend:v3
        imagePullPolicy: Never
        ports:
        - containerPort: 13151
        envFrom:
        - configMapRef:
            name: xrpaout-config
        - secretRef:
            name: xrpaout-secret
        volumeMounts:
        - name: db-volume
          mountPath: /app/data
      - name: frontend
        image: xrpaout-frontend:v3
        imagePullPolicy: Never
        ports:
        - containerPort: 80
      volumes:
      - name: db-volume
        persistentVolumeClaim:
          claimName: xrpaout-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: xrpaout-service
spec:
  type: NodePort
  selector:
    app: xrpaout
  ports:
    - name: api
      port: 13151
      targetPort: 13151
      nodePort: 13151
    - name: web
      port: 13152
      targetPort: 80
      nodePort: 13152
